name: Flutter CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        
    - name: Create fake google-services.json
      run: |
        echo '{
          "project_info": {"project_number": "123456789", "project_id": "fake-project", "storage_bucket": "fake-project.appspot.com"},
          "client": [{"client_info": {"mobilesdk_app_id": "1:123456789:android:fake", "android_client_info": {"package_name": "com.example.quran_reels"}}, "api_key": [{"current_key": "fake-key"}]}]
        }' > android/app/google-services.json
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build APK
      run: flutter build apk --release
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
