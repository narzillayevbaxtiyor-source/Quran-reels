name: Flutter CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
    - name: Create google-services.json
      run: |
        mkdir -p android/app
        cat > android/app/google-services.json << 'EOF'
        {
          "project_info": {
            "project_number": "123456789",
            "project_id": "fake-project",
            "storage_bucket": "fake-project.appspot.com"
          },
          "client": [{
            "client_info": {
              "mobilesdk_app_id": "1:123456789:android:fake",
              "android_client_info": {"package_name": "com.quranreels.quran_reels"}
            },
            "api_key": [{"current_key": "fake-key"}]
          }]
        }
        EOF
    - run: flutter pub get
    - run: flutter build apk --debug --target-platform android-arm,android-arm64,android-x64
    - uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: build/app/outputs/flutter-apk/app-debug.apk
